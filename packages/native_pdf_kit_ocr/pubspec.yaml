name: native_pdf_kit_ocr
version: 0.1.1
description: >-
  On-device OCR and high-fidelity text extraction for native_pdf_kit. Apple
  Vision and PDFKit on iOS/macOS, ML Kit or LiteRT/PP-OCRv5 on Android, with
  realtime progress, cancellation and structured line boxes.
homepage: https://github.com/eishalcyril/native_pdf_kit
repository: https://github.com/eishalcyril/native_pdf_kit
issue_tracker: https://github.com/eishalcyril/native_pdf_kit/issues

topics:
  - pdf
  - ocr
  - text-extraction
  - vision
  - ml-kit

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  jni: ^1.1.2
  native_pdf_kit: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
        sharedDarwinSource: true
      macos:
        ffiPlugin: true
        sharedDarwinSource: true

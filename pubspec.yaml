name: native_pdf_kit
version: 0.2.0
description: >-
  Fast, dependency-free native PDF rendering and image encoding for Flutter on
  iOS and macOS. Direct FFI to CoreGraphics and ImageIO, no platform channels,
  no third-party source.
homepage: https://github.com/eishalcyril
repository: https://github.com/eishalcyril/native_pdf_kit
issue_tracker: https://github.com/eishalcyril/native_pdf_kit/issues

topics:
  - pdf
  - ffi
  - image
  - document

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  jni: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  jnigen: 1.0.0
  lints: ^6.1.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
        sharedDarwinSource: true
      macos:
        ffiPlugin: true
        sharedDarwinSource: true
